services:
  - type: web
    name: smart-home-backend
    env: node
    region: singapore
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    autoDeploy: true
    envVars:
      - key: PORT
        value: "5000"
      - key: NODE_ENV
        value: production
      - key: MQTT_HOST
        value: 93bad3def29641e399de9a7b9c676613.s1.eu.hivemq.cloud
      - key: MQTT_PORT
        value: "8883"
      - key: MQTT_USER
        value: tohits
      - key: MQTT_PASS
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: TIMEZONE
        value: Asia/Kolkata
      - key: LATITUDE
        value: "28.6139"
      - key: LONGITUDE
        value: "77.2090"
      - key: OTA_SECRET_KEY
        generateValue: true
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
